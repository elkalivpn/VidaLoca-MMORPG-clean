version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: vidaloca-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: vidaloca
      POSTGRES_PASSWORD: vidaloca_dev
      POSTGRES_DB: vidaloca
    ports:
      - '5432:5432'
    volumes:
      - vidaloca_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vidaloca']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vidaloca-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - vidaloca_redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  vidaloca_pgdata:
  vidaloca_redis:
