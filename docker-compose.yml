services:
  postgres:
    image: postgres:16-alpine
    container_name: vidaloca-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: vidaloca
      POSTGRES_PASSWORD: vidaloca_dev
      POSTGRES_DB: vidaloca
    ports:
      - '5432:5432'
    volumes:
      - vidaloca_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vidaloca']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vidaloca-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - vidaloca_redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vidaloca-api
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://vidaloca:vidaloca_dev@postgres:5432/vidaloca
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-vidaloca-docker-dev-secret-change-in-prod}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000/api}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-http://localhost:3000}
    container_name: vidaloca-client
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: production
      PORT: 3001
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000/api}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-http://localhost:3000}
    depends_on:
      api:
        condition: service_started

volumes:
  vidaloca_pgdata:
  vidaloca_redis:
